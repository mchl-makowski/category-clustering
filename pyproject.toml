[project]
name = "problem-clustering"
version = "0.1.0"
description = "Groups Service Desk Tickets into Problems (Methods A/B/C) and compares them."
requires-python = ">=3.11,<3.12"
dependencies = [
    "ipywidgets>=8.1.9",
    "numpy>=2.4.6",
    "openai>=3.51.0",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "tqdm>=4.70.1",
]

[project.scripts]
problem-clustering = "problem_clustering.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/problem_clustering"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

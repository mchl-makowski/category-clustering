# Run configuration. Any value can be overridden from the CLI: --set method_a.distance_threshold=0.3
# Secrets/endpoint come from env: FOUNDRY_API_KEY, FOUNDRY_ENDPOINT, FOUNDRY_API_VERSION.

granularity: medium          # coarse | medium | fine (Problem definition in every LLM prompt)

backend:
  kind: azure                # azure | fake (offline, deterministic)
  embedding_deployment: text-embedding-3-large
  chat_deployment: gpt-4o
  embed_batch_size: 64

naming:
  sample_size: 8             # Tickets shown to the LLM when naming a Problem

method_a:
  algorithm: agglomerative  # agglomerative | hdbscan
  distance_threshold: 0.35   # cosine distance; lower = finer Problems
  linkage: average
  min_cluster_size: 2         # hdbscan only; noise Tickets become one-Ticket Problems
  min_samples: null          # hdbscan only; null = min_cluster_size

output:
  example_tickets: 5

symptom_summary:
  enabled: false             # true = LLM rewrites each Ticket into one symptom + context line; that line is grouped
  log_summaries: false       # true = write each summary into the run log

judge:
  deployment: gpt-4o         # fixed Judge model, independent of backend.chat_deployment
  sample_size: 8             # Tickets per Mixed check
  split_sample_size: 4       # Tickets per Problem in a Split check
  neighbours: 3              # nearest Problems checked for a Split Problem
  max_problems: null         # judge only the N largest Problems (null = all)

# Run configuration. Any value can be overridden from the CLI: --set method_a.distance_threshold=0.3
# Secrets/endpoint come from env: FOUNDRY_API_KEY, FOUNDRY_ENDPOINT, FOUNDRY_API_VERSION.

granularity: medium          # coarse | medium | fine (Problem definition in every LLM prompt)

backend:
  kind: azure                # azure | fake (offline, deterministic)
  embedding_deployment: text-embedding-3-large
  chat_deployment: gpt-4o
  embed_batch_size: 64

naming:
  sample_size: 8             # Tickets shown to the LLM when naming a Problem

method_a:
  algorithm: agglomerative
  distance_threshold: 0.35   # cosine distance; lower = finer Problems
  linkage: average

output:
  example_tickets: 5
